services:
  portfolio-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-portfolio-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-32000}:32000"
    environment:
      - NODE_ENV=production
      - PORT=32000
      - DB_FILE_PATH=/app/db/portfolio.sqlite
    env_file:
      - .env
    volumes:
      - ./db:/app/db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:32000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
